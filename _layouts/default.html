<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | SACSAB</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-deep: #111827;
            --bg-card: #1f293d;
            --bg-card-hover: #2d3748;
            --border-color: #374151;
            --border-highlight: #0284c7;
            --text-main: #f9fafb;
            --text-muted: #d1d5db;
            --accent-brand: #38bdf8;
            --accent-glow: #0284c7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            margin: 0;
            color: var(--text-main);
            background: var(--bg-deep);
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        h4 {
            color: #ffffff;
            margin-top: 0;
            letter-spacing: -0.02em;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            margin-top: 0;
        }

        a {
            color: var(--accent-brand);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #7dd3fc;
        }

        /* Tech-styled Header */
        header {
            background: rgba(17, 24, 39, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0 10%;
            height: 75px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            letter-spacing: 2px;
            font-weight: 700;
            color: #ffffff;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 35px;
        }

        nav a {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        nav a:hover,
        nav li.active a {
            color: #ffffff;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 6px;
        }

        .menu-toggle span {
            width: 24px;
            height: 2px;
            background: #ffffff;
            transition: 0.3s;
        }

        /* Hero Layout */
        .hero {
            position: relative;
            background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.12), transparent 50%),
                radial-gradient(circle at bottom left, rgba(2, 132, 199, 0.08), transparent 45%);
            padding: 8rem 10% 7rem 10%;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
        }

        .hero h1 {
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 1rem;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            color: #ffffff;
        }

        .tagline {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-brand);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }

        .container {
            padding: 6rem 10%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Tactical Cards Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 3rem;
        }

        .card {
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 8px;
            background: var(--bg-card);
            position: relative;
            transition: border-color 0.25s ease, background 0.25s ease, transform 0.2s ease;
        }

        .card:hover {
            border-color: var(--border-highlight);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .card h3 {
            font-size: 1.35rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Action Button */
        .btn-primary {
            display: inline-block;
            background: rgba(56, 189, 248, 0.12);
            color: #ffffff;
            border: 1px solid var(--accent-brand);
            padding: 0.75rem 1.7rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 4px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            background: var(--accent-brand);
            color: #111827;
            font-weight: 600;
        }

        footer {
            background: #0b0f19;
            color: var(--text-muted);
            text-align: left;
            padding: 4rem 10%;
            margin-top: 6rem;
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
        }

        .footer-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        footer p {
            margin: 0;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            header {
                padding: 0 6%;
                height: 70px;
            }

            .menu-toggle {
                display: flex;
            }

            nav ul {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background: var(--bg-card);
                padding: 30px 0;
                text-align: center;
                border-top: 1px solid var(--border-color);
                border-bottom: 1px solid var(--border-color);
            }

            nav ul.active {
                display: flex;
            }

            nav ul li {
                padding: 12px 0;
            }

            .hero {
                padding: 6rem 6% 5rem 6%;
            }

            .hero h1 {
                font-size: 2.3rem;
            }

            .container {
                padding: 4rem 6%;
            }

            .footer-wrapper {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">SACSAB</div>

        <nav>
            <ul id="nav-list">
                <li><a href="/">Home</a></li>
                <li><a href="/about/">About</a></li>
                <li><a href="/products/">Our Systems</a></li>
                <li><a href="/contact/">Contact</a></li>
            </ul>
        </nav>

        <div class="menu-toggle" id="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <div class="footer-wrapper">
            <div>
                <p>&copy; 2026 Swedish Airspace Control Systems AB. All Rights Reserved.</p>
                <p style="margin-top: 4px; color: var(--text-muted)">Uppsala, Sweden</p>
            </div>
            <div>
                <p>Org.nr: 559574-3773</p>
            </div>
        </div>
    </footer>

    <script>
        const menuBtn = document.getElementById('mobile-menu');
        const navList = document.getElementById('nav-list');

        menuBtn.addEventListener('click', () => {
            navList.classList.toggle('active');
        });
    </script>

</body>

</html>
