<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | SACSAB</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #0b0f19;
            --bg-card: #111827;
            --bg-card-hover: #1f293d;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-brand: #38bdf8;
            --accent-subtle: rgba(56, 189, 248, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            margin: 0;
            color: var(--text-main);
            background: var(--bg-deep);
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 {
            color: #ffffff;
            margin-top: 0;
            letter-spacing: -0.02em;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            margin-top: 0;
        }

        a {
            color: var(--accent-brand);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #7dd3fc;
        }

        /* Mono Subheaders & Badges */
        .mono-tag {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-brand);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .badge-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            display: inline-block;
            margin-bottom: 0.75rem;
        }

        .badge-status.active {
            border-color: rgba(56, 189, 248, 0.4);
            color: var(--accent-brand);
            background: var(--accent-subtle);
        }

        /* Header Navigation */
        header {
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0 8%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            letter-spacing: 0.15em;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-dot {
            width: 7px;
            height: 7px;
            background: var(--accent-brand);
            border-radius: 50%;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 32px;
        }

        nav a {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        nav a:hover,
        nav li.active a {
            color: #ffffff;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .menu-toggle span {
            width: 22px;
            height: 2px;
            background: #ffffff;
            transition: 0.3s;
        }

        /* Hero Layout */
        .hero {
            position: relative;
            background: radial-gradient(80% 80% at 50% 10%, rgba(56, 189, 248, 0.06), transparent);
            padding: 7rem 8% 6rem 8%;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .hero h1 {
            font-size: 3.25rem;
            line-height: 1.15;
            margin-bottom: 1.25rem;
            max-width: 850px;
            margin-left: auto;
            margin-right: auto;
        }

        .container {
            padding: 5rem 8%;
            max-width: 1140px;
            margin: 0 auto;
        }

        /* Tactical Cards Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 2.5rem;
        }

        .card {
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 6px;
            background: var(--bg-card);
            transition: border-color 0.25 ease, background 0.25s ease;
        }

        .card:hover {
            border-color: var(--border-highlight);
            background: var(--bg-card-hover);
        }

        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
        }

        /* Action Buttons */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-brand);
            color: #0b0f19;
            border: 1px solid var(--accent-brand);
            padding: 0.75rem 1.6rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 4px;
            letter-spacing: 0.02em;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: #7dd3fc;
            border-color: #7dd3fc;
            color: #0b0f19;
        }

        footer {
            background: #070a10;
            color: var(--text-muted);
            padding: 3.5rem 8%;
            margin-top: 4rem;
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
        }

        .footer-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1140px;
            margin: 0 auto;
        }

        footer p {
            margin: 0;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            header {
                padding: 0 5%;
            }

            .menu-toggle {
                display: flex;
            }

            nav ul {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background: var(--bg-card);
                padding: 20px 0;
                text-align: center;
                border-bottom: 1px solid var(--border-color);
            }

            nav ul.active {
                display: flex;
            }

            .hero {
                padding: 4.5rem 5% 3.5rem 5%;
            }

            .hero h1 {
                font-size: 2.2rem;
            }

            .container {
                padding: 3rem 5%;
            }

            .footer-wrapper {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <span class="logo-dot"></span>
            SACSAB
        </div>

        <nav>
            <ul id="nav-list">
                <li><a href="/">Home</a></li>
                <li><a href="/about/">About</a></li>
                <li><a href="/products/">Our Systems</a></li>
                <li><a href="/contact/">Contact</a></li>
            </ul>
        </nav>

        <div class="menu-toggle" id="mobile-menu" aria-label="Toggle navigation menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <div class="footer-wrapper">
            <div>
                <p>&copy; 2026 Swedish Airspace Control Systems AB. All Rights Reserved.</p>
                <p style="margin-top: 4px; opacity: 0.6;">Uppsala, Sweden</p>
            </div>
            <div>
                <p>Org.nr: 559574-3773</p>
            </div>
        </div>
    </footer>

    <script>
        const menuBtn = document.getElementById('mobile-menu');
        const navList = document.getElementById('nav-list');

        menuBtn.addEventListener('click', () => {
            navList.classList.toggle('active');
        });
    </script>

</body>

</html>
